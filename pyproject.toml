[project]
name = "aegissoc-x"
version = "0.1.0"
description = "Reproducible ML and human-reviewed agentic security investigation prototype"
requires-python = ">=3.11,<3.14"
dependencies = [
 "numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4",
 "joblib>=1.3", "fastapi>=0.110", "uvicorn>=0.27",
 "pydantic>=2.5", "streamlit>=1.35", "httpx>=0.27",
 "langgraph>=0.2", "requests>=2.31"
]
[project.optional-dependencies]
deep-learning = ["torch>=2.2"]
experiments = ["mlflow>=2.12"]
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
[tool.ruff]
line-length = 100
[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegissoc"]